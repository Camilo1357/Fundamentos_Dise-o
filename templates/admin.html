<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mercado VIVA - Administrador
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}">

</head>


<body>


    <!-- =========================================
         NAVBAR
         ========================================= -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <span></span>
            </div>

            <h2>
                MERCADO VIVA
            </h2>

        </div>


        <div class="admin-user">

            <div class="user-circle">
                AV
            </div>

            <span>
                Admin Vista
            </span>

            <a
                href="/logout"
                class="logout-button">

                Cerrar sesión

            </a>

        </div>

    </header>


    <!-- =========================================
         CONTENIDO
         ========================================= -->

    <main class="admin-container">


        <div class="page-header">

            <div>

                <h1>
                    Panel de administración
                </h1>

                <p>
                    Gestiona las solicitudes de devolución de los clientes.
                </p>

            </div>

        </div>


        <!-- =========================================
             SOLICITUDES
             ========================================= -->

        <section class="solicitudes-section">


            <div class="section-header">

                <div>

                    <h2>
                        Solicitudes de devolución
                    </h2>

                    <p>
                        Revisa y procesa las solicitudes pendientes.
                    </p>

                </div>

            </div>


            <div id="solicitudes-list">

                <div class="loading">

                    Cargando solicitudes...

                </div>

            </div>


        </section>


    </main>


    <script
        src="{{ url_for('static', filename='js/admin.js') }}">
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercado VIVA - Crear cuenta</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- BARRA DE NAVEGACIÓN -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <span></span>
            </div>

            <h2>MERCADO VIVA</h2>

        </div>


        <div class="nav-buttons">

            <a href="/crear_cuenta" class="create-button">
                Crear cuenta
            </a>

            <a href="/" class="signin-button">
                Iniciar sesión
            </a>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="main-container">

        <section class="image-section">

            <img
                src="{{ url_for('static', filename='supermercado.jpg') }}"
                alt="Interior de Mercado VIVA"
            >

        </section>


        <!-- FORMULARIO -->

        <section class="login-card">

            <div class="small-logo">

                <div class="logo-icon">
                    <span></span>
                </div>

            </div>


            <h1>Crea tu cuenta</h1>

            <p class="subtitle">
                Regístrate para comprar en Mercado VIVA
            </p>


            <form
                id="create-form"
                action="/registro"
                method="POST"
            >

                <!-- NOMBRE -->

                <div class="input-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <div class="input-container">

                        <span class="input-icon">♙</span>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-container">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-container">

                        <span class="input-icon">♧</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        >

                        <button
                            type="button"
                            id="show-password"
                            class="password-button"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Crear cuenta
                </button>


                <p id="create-result"></p>

            </form>


            <!-- SEPARADOR -->

            <div class="separator">

                <span>o</span>

            </div>


            <!-- LOGIN -->

            <p class="register-text">

                ¿Ya tienes cuenta en Mercado VIVA?

                <a href="/">
                    Inicia sesión
                </a>

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="{{ url_for('static', filename='js/crear_cuenta.js') }}"></script>

</body>

</html>

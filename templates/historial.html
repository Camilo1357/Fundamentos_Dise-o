<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercado VIVA - Historial</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='historial.css') }}"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <span></span>
            </div>

            <h2>MERCADO VIVA</h2>

        </div>


        <div class="nav-buttons">

            <a href="/cliente" class="create-button">
                Inicio
            </a>

            <a href="/logout" class="signin-button">
                Cerrar sesión
            </a>

        </div>

    </header>


    <main class="history-container">

        <h1>
            Historial de pedidos
        </h1>


        <div class="history-content">

            <section id="orders-list">

                <!-- JavaScript cargará los pedidos aquí -->

            </section>


            <section id="order-detail">

                <div class="no-orders">

                    <div class="no-orders-icon">
                        ◇
                    </div>

                    <h2>
                        Selecciona un pedido
                    </h2>

                    <p>
                        Selecciona uno de tus pedidos
                        para ver sus detalles.
                    </p>

                </div>

            </section>

        </div>

    </main>


    <script src="{{ url_for('static', filename='historial.js') }}"></script>

</body>

</html>

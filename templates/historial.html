<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mercado VIVA - Historial</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/historial.css') }}"
    >

</head>


<body>


    <!-- =========================================
         NAVBAR
         ========================================= -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                <span></span>
            </div>

            <h2>MERCADO VIVA</h2>

        </div>


        <div class="nav-buttons">

            <a
                href="/cliente"
                class="create-button"
            >
                Inicio
            </a>

            <a
                href="/logout"
                class="signin-button"
            >
                Cerrar sesión
            </a>

        </div>

    </header>



    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->

    <main class="history-container">


        <!-- ENCABEZADO -->

        <div class="page-header">

            <h1>
                Historial de pedidos
            </h1>

            <p>
                Revisa tus pedidos y solicita devoluciones.
            </p>

        </div>



        <!-- PEDIDOS + DETALLE -->

        <div class="history-content">


            <!-- =====================================
                 LISTA DE PEDIDOS
                 ===================================== -->

            <section class="orders-section">

                <div id="orders-list">

                    <!--
                        JavaScript cargará los pedidos
                        provenientes de Flask.
                    -->

                </div>

            </section>



            <!-- =====================================
                 DETALLE DEL PEDIDO
                 ===================================== -->

            <section
                id="order-detail"
                class="order-detail"
            >

                <div class="detail-placeholder">

                    <div class="placeholder-icon">
                        ◇
                    </div>

                    <h2>
                        Selecciona un pedido
                    </h2>

                    <p>
                        Selecciona uno de tus pedidos
                        para ver sus detalles.
                    </p>

                </div>

            </section>


        </div>


    </main>



    <script
        src="{{ url_for('static', filename='js/historial.js') }}"
    ></script>


</body>

</html>

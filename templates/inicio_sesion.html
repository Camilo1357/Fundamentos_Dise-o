<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Permite utilizar caracteres como á, é, í, ó, ú y ñ -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte correctamente a celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nombre que aparecerá en la pestaña del navegador -->
    <title>Mercado VIVA - Iniciar sesión</title>

    <!-- Conectamos nuestro archivo CSS con el HTML -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         BARRA DE NAVEGACIÓN
         ========================= -->

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <span></span>
            </div>

            <h2>MERCADO VIVA</h2>
        </div>

        <!-- Botones de la derecha -->
        <div class="nav-buttons">
    <a href="/crear_cuenta" class="create-button">Crear cuenta</a>
    <a href="/" class="signin-button">Iniciar sesión</a>
        </div>

    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->

    <main class="main-container">

        <!-- Imagen del supermercado -->
        <section class="image-section">
            <img src="{{ url_for('static', filename='supermercado.jpg') }}"
                 alt="Interior de Mercado VIVA">
        </section>


        <!-- =========================
             FORMULARIO DE LOGIN
             ========================= -->

        <section class="login-card">

            <!-- Logo pequeño -->
            <div class="small-logo">
                <div class="logo-icon">
                    <span></span>
                </div>
            </div>

            <!-- Título -->
            <h1>Bienvenido</h1>

            <p class="subtitle">
                Inicia sesión para comprar en Mercado VIVA
            </p>


            <!-- Formulario -->
            <form id="login-form">

                <!-- Campo de correo -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-container">

                        <!-- Icono sencillo -->
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="name@example.com"
                            required
                        >

                    </div>

                </div>


                <!-- Campo de contraseña -->
                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-container">

                        <!-- Icono de candado -->
                        <span class="input-icon">♧</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required
                        >

                        <!-- Botón para mostrar/ocultar contraseña -->
                        <button
                            type="button"
                            id="show-password"
                            class="password-button">
                            ◉
                        </button>

                    </div>

                </div>


                <!-- Botón principal -->
                <button
                    type="submit"
                    class="login-button">

                    Iniciar Sesión

                </button>


                <!-- Aquí JavaScript mostrará mensajes -->
                <p id="login-result"></p>

            </form>


            <!-- Separador -->
            <div class="separator">
                <span>o</span>
            </div>


            <!-- Crear cuenta -->
            <p class="register-text">
                Nuevo en Mercado VIVA?

                <a href="/crear_cuenta">
                    Crea la cuenta
                </a>
            </p>

        </section>

    </main>


    <!-- Conectamos nuestro archivo JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercado VIVA - Iniciar sesión</title>

    <!-- Conexión con el CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         BARRA DE NAVEGACIÓN
         ========================= -->

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-icon">
                <span></span>
            </div>

            <h2>MERCADO VIVA</h2>

        </div>


        <!-- Botones de la derecha -->
        <div class="nav-buttons">

            <a href="/crear_cuenta" class="create-button">
                Crear cuenta
            </a>

            <a href="/" class="signin-button">
                Iniciar sesión
            </a>

        </div>

    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->

    <main class="main-container">

        <!-- Imagen del supermercado -->
        <section class="image-section">

            <img
                src="{{ url_for('static', filename='supermercado.jpg') }}"
                alt="Interior de Mercado VIVA"
            >

        </section>


        <!-- =========================
             FORMULARIO DE LOGIN
             ========================= -->

        <section class="login-card">

            <!-- Logo pequeño -->
            <div class="small-logo">

                <div class="logo-icon">
                    <span></span>
                </div>

            </div>


            <!-- Título -->
            <h1>Bienvenido</h1>

            <p class="subtitle">
                Inicia sesión para comprar en Mercado VIVA
            </p>


            <!-- Formulario -->
            <form
                id="login-form"
                action="/login"
                method="POST"
            >

                <!-- Campo de correo -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-container">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        >

                    </div>

                </div>


                <!-- Campo de contraseña -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-container">

                        <span class="input-icon">♧</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        >

                        <!-- Botón para mostrar/ocultar contraseña -->

                        <button
                            type="button"
                            id="show-password"
                            class="password-button"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- Botón principal -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Iniciar Sesión
                </button>


                <!-- Mensajes -->

                <p id="login-result"></p>

            </form>


            <!-- Separador -->

            <div class="separator">
                <span>o</span>
            </div>


            <!-- Crear cuenta -->

            <p class="register-text">

                Nuevo en Mercado VIVA?

                <a href="/crear_cuenta">
                    Crea la cuenta
                </a>

            </p>

        </section>

    </main>


    <!-- Conexión con JavaScript -->

    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>

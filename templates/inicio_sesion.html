<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Mercado VIVA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon"></div>

            <h2>Mercado VIVA</h2>

        </div>


        <div class="nav-buttons">

            <a
                href="/crear_cuenta"
                class="create-button"
            >
                Crear cuenta
            </a>

            <a
                href="/"
                class="signin-button"
            >
                Iniciar sesión
            </a>

        </div>

    </nav>


    <!-- CONTENIDO -->

    <main class="main-container">

        <section class="image-section">

            <img
                src="{{ url_for('static', filename='supermercado.jpg') }}"
                alt="Mercado VIVA"
            >

        </section>


        <section class="login-card">

            <div class="small-logo">

                <div class="logo-icon"></div>

            </div>


            <h1>Bienvenido</h1>

            <p class="subtitle">
                Inicia sesión para continuar
            </p>


            <!-- LOGIN -->

            <form
                action="/login"
                method="POST"
                id="login-form"
            >

                <!-- CORREO -->

                <div class="input-group">

                    <label for="email">
                        CORREO ELECTRÓNICO
                    </label>

                    <div class="input-container">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Tu correo electrónico"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        CONTRASEÑA
                    </label>

                    <div class="input-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            required
                        >

                        <button
                            type="button"
                            id="show-password"
                        >
                            ◉
                        </button>

                    </div>

                </div>

                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Iniciar sesión
                </button>


                <!-- RESULTADO -->

                <p id="login-result"></p>

            </form>


            <div class="separator"></div>


            <p class="register-text">

                ¿No tienes una cuenta?

                <a href="/crear_cuenta">
                    Crear cuenta
                </a>

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>

</body>

</html>
